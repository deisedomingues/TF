<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Agenda Clínica</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="tela-centralizada">
    <section class="card-login">

      <div class="logo-area">
        <div class="logo-simbolo">D</div>
        <h1>Agenda Clínica</h1>
        <p class="subtitulo">
          Acesse sua área para organizar pacientes, sessões e financeiro.
        </p>
      </div>

      <form id="formLogin">
        <div class="form-grupo">
          <label for="email">E-mail</label>
          <input 
            type="email" 
            id="email" 
            placeholder="Digite seu e-mail"
            required
          />
        </div>

        <div class="form-grupo">
          <label for="senha">Senha</label>
          <input 
            type="password" 
            id="senha" 
            placeholder="Digite sua senha"
            required
          />
        </div>

        <button type="submit" class="btn btn-principal btn-largura-total">
          Entrar
        </button>
      </form>

      <p class="subtitulo" style="text-align:center; margin-top:18px;">
        Protótipo visual criado para Deise Domingues
      </p>

    </section>
  </main>
  <script src="js/tema.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
