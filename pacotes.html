<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pacotes | Tatiely Psicologia</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

 

  <main class="conteudo">
    <div class="container">

      <a href="financeiro.html" class="subtitulo" style="display: inline-block; margin-bottom: 16px; text-decoration: none;">
        ← Voltar
      </a>

      <section class="cabecalho-pagina">
        <h1>Pacotes de sessões</h1>
        <p class="subtitulo">
          Cadastre pacotes pré-pagos e acompanhe quantas sessões já foram utilizadas.
        </p>
      </section>

      <section class="card" style="margin-bottom: 24px;">
        <div class="barra-acoes">
          <div>
            <h2>Novo pacote</h2>
            <p class="subtitulo">
              Informe o valor pago e a quantidade de sessões combinadas com o paciente.
            </p>
          </div>

          <button type="button" class="btn btn-claro" id="btnAlternarFormularioPacote">
            Abrir formulário
          </button>
        </div>

        <div id="areaFormularioPacote" style="display: none; margin-top: 18px;">
          <form id="formPacote">

            <div class="form-grupo">
              <label for="paciente">Paciente</label>
              <select id="paciente" required>
                <option value="">Carregando pacientes...</option>
              </select>
            </div>

            <div class="form-grupo">
              <label for="descricao">Descrição do pacote</label>
              <input
                type="text"
                id="descricao"
                placeholder="Ex: Pacote mensal - 4 sessões"
              />
            </div>

            <div class="linha-form">
              <div class="form-grupo">
                <label for="valorPago">Valor pago</label>
                <input
                  type="number"
                  id="valorPago"
                  min="0"
                  step="0.01"
                  placeholder="Ex: 1000.00"
                  required
                />
              </div>

              <div class="form-grupo">
                <label for="valorPorSessao">Valor por sessão</label>
                <input
                  type="number"
                  id="valorPorSessao"
                  min="0"
                  step="0.01"
                  placeholder="Ex: 250.00"
                  required
                />
              </div>
            </div>

            <div class="linha-form">
              <div class="form-grupo">
                <label for="quantidadeSessoes">Quantidade de sessões</label>
                <input
                  type="number"
                  id="quantidadeSessoes"
                  min="1"
                  placeholder="Ex: 4"
                  required
                />
              </div>

              <div class="form-grupo">
                <label for="dataPagamento">Data do pagamento</label>
                <input type="date" id="dataPagamento" />
              </div>
            </div>

            <div class="form-grupo">
              <label for="formaPagamento">Forma de pagamento</label>
              <select id="formaPagamento">
                <option value="">Selecione</option>
                <option value="Pix">Pix</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Cartão de crédito">Cartão de crédito</option>
                <option value="Cartão de débito">Cartão de débito</option>
                <option value="Transferência">Transferência</option>
                <option value="Outro">Outro</option>
              </select>
            </div>

            <button type="submit" class="btn btn-principal btn-largura-total" id="btnSalvarPacote">
              Salvar pacote
            </button>

            <p id="mensagemPacote" class="mensagem-form" style="margin-top: 14px;"></p>

          </form>
        </div>
      </section>

      <section class="card">
        <div class="barra-acoes">
          <div>
            <h2>Pacotes cadastrados</h2>
            <p class="subtitulo">
              Acompanhe pacotes ativos, encerrados e sessões restantes.
            </p>
          </div>

          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button type="button" class="btn btn-claro" onclick="alterarFiltroPacotes('ativos')">Ativos</button>
            <button type="button" class="btn btn-claro" onclick="alterarFiltroPacotes('encerrados')">Encerrados</button>
            <button type="button" class="btn btn-claro" onclick="alterarFiltroPacotes('todos')">Todos</button>
          </div>
        </div>

        <div class="form-grupo" style="max-width: 420px;">
          <label for="buscaPacientePacote">Buscar paciente</label>
          <input
            type="text"
            id="buscaPacientePacote"
            placeholder="Digite o nome do paciente"
          />
        </div>

        <div class="lista" id="listaPacotes"></div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/tema-global.js"></script>
  <script src="js/pacotes.js"></script>
</body>
<main class="conteudo">
  <div class="container">

    <div class="topo-interno-simples">
      <a href="home.html" class="btn btn-claro">← Voltar</a>
    </div>
</html>
