<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | Amanda Souza Fisioterapeuta</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <main class="tela-centralizada">
    <section class="card-login">

      <div class="logo-area">
        <img
          src="css/images/AmandaSouza.JPG"
          alt="Logo Amanda Souza Fisioterapeuta"
          class="logo-login"
        />
      </div>

      <form id="formLogin">
        <div class="form-grupo">
          <label for="email">E-mail</label>
          <input 
            type="email" 
            id="email" 
            placeholder="Digite seu e-mail"
            required
          />
        </div>

        <div class="form-grupo">
          <label for="senha">Senha</label>
          <input 
            type="password" 
            id="senha" 
            placeholder="Digite sua senha"
            required
          />
        </div>

        <button type="submit" class="btn btn-principal btn-largura-total">
          Entrar
        </button>
      </form>

    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
