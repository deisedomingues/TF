<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | Tatiely Psicologia</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <main class="tela-centralizada">
    <section class="card-login">

      <div class="logo-area">
        <div class="marca-icone" style="margin: 0 auto 12px auto;">T</div>
        <h1 style="text-align: center; margin-bottom: 6px;">Tatiely Psicologia</h1>
        <p class="subtitulo" style="text-align: center;">
          Acesse o painel administrativo
        </p>
      </div>

      <form id="formLogin">
        <div class="form-grupo">
          <label for="email">E-mail</label>
          <input 
            type="email" 
            id="email" 
            placeholder="Digite seu e-mail"
            required
          />
        </div>

        <div class="form-grupo">
          <label for="senha">Senha</label>
          <input 
            type="password" 
            id="senha" 
            placeholder="Digite sua senha"
            required
          />
        </div>

        <button type="submit" class="btn btn-principal btn-largura-total" id="btnEntrar">
          Entrar
        </button>

        <p id="mensagemLogin" class="mensagem-form" style="margin-top: 14px;"></p>
      </form>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/tema-global.js"></script>
  <script src="js/login.js"></script>
</body>
<main class="conteudo">
  <div class="container">

    <div class="topo-interno-simples">
      <a href="home.html" class="btn btn-claro">← Voltar</a>
    </div>
</html>
