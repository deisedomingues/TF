<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pacientes | Tatiely Psicologia</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

 

  <main class="conteudo">
    <div class="container">

      <section class="cabecalho-pagina">
        <h1>Pacientes</h1>
        <p class="subtitulo">
          Cadastre pacientes e consulte rapidamente seus dados principais.
        </p>
      </section>

      <section class="card" style="margin-bottom: 24px;">
        <h2>Novo paciente</h2>

        <form id="formPaciente">
          <div class="linha-form">
            <div class="form-grupo">
              <label for="nome">Nome completo</label>
              <input type="text" id="nome" placeholder="Nome do paciente" required />
            </div>

            <div class="form-grupo">
              <label for="nascimento">Data de nascimento</label>
              <input type="date" id="nascimento" />
            </div>
          </div>

          <div class="linha-form">
            <div class="form-grupo">
              <label for="telefone">Telefone</label>
              <input type="text" id="telefone" placeholder="(00) 00000-0000" />
            </div>

            <div class="form-grupo">
              <label for="email">E-mail</label>
              <input type="email" id="email" placeholder="email@exemplo.com" />
            </div>
          </div>

          <div class="linha-form">
            <div class="form-grupo">
              <label for="contatoEmergenciaNome">Contato de emergência</label>
              <input type="text" id="contatoEmergenciaNome" placeholder="Nome da pessoa" />
            </div>

            <div class="form-grupo">
              <label for="contatoEmergenciaTelefone">Telefone do contato</label>
              <input type="text" id="contatoEmergenciaTelefone" placeholder="(00) 00000-0000" />
            </div>
          </div>

          <div class="linha-form">
            <div class="form-grupo">
              <label for="contatoEmergenciaParentesco">Parentesco</label>
              <input type="text" id="contatoEmergenciaParentesco" placeholder="Ex: mãe, irmã, esposo..." />
            </div>

            <div class="form-grupo">
              <label for="status">Status</label>
              <select id="status">
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
              </select>
            </div>
          </div>

          <div class="form-grupo">
            <label for="observacoes">Observações iniciais</label>
            <textarea id="observacoes" placeholder="Informações gerais sobre o paciente"></textarea>
          </div>

          <button type="submit" class="btn btn-principal" id="btnSalvarPaciente">
            Salvar paciente
          </button>

          <p id="mensagemPaciente" class="mensagem-form" style="margin-top: 14px;"></p>
        </form>
      </section>

      <section>
        <div class="barra-acoes">
          <h2>Pacientes cadastrados</h2>

          <input 
            type="text" 
            id="buscaPaciente"
            placeholder="Buscar paciente..."
            style="max-width: 280px;"
          />
        </div>

        <div class="lista" id="listaPacientes"></div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/tema-global.js"></script>
  <script src="js/pacientes.js"></script>
</body>
<main class="conteudo">
  <div class="container">

    <div class="topo-interno-simples">
      <a href="home.html" class="btn btn-claro">← Voltar</a>
    </div>
</html>
